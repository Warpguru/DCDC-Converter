# Serial Controller - default exit credentials
#
# These credentials are required by the POST /api/exit endpoint (HTTP Basic Auth).
# Override these values by supplying an external configuration file as the second
# command-line argument:
#
#   java -jar SerialController.jar COM3 C:\path\to\myconfig.properties
#
serialcontroller.admin.username=admin
serialcontroller.admin.password=secret
