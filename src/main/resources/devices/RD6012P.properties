# Riden RD6012P device capability limits
# Source: RD6012P datasheet / doc/Riden.md
device.name=RD6012P
device.manufacturer=Riden
device.maxVoltage=60.0
device.minVoltage=0.0
device.maxCurrent=12.0
device.minCurrent=0.0
device.maxPower=720.0
device.topology=BUCK
#
# KNOWN LIMITATIONS - P-series dynamic scaling (out of scope for detection-gaps-plan):
#
# 1. Voltage scaling: The RD6012P uses scale 1000 for voltage (raw / 1000.0 = volts),
#    but the RidenRD60xx driver declares VSET/VOUT with scale 100. Voltage reads and
#    writes will be off by 10x on this device until a dedicated P-series driver is added.
#
# 2. Dynamic current scaling: Register 0x0002 is the Current Range Status flag:
#      0 = Low Range  (0–6A),    scale 10000 (0.1mA resolution)
#      1 = High Range (6–12A),   scale  1000 (1mA resolution)
#    The RidenRD60xx driver uses a fixed scale of 1000 (ISET/IOUT), which is only
#    correct in the high range. In the low range, current reads/writes are off by 10x.
#
# Both issues require a dedicated RidenRD60xxP driver that reads Register 0x0002 before
# each current operation and uses conditional scaling. See doc/Riden.md for details.
